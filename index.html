
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Store Name & Details</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;margin:20px}
		form{max-width:420px}
		label{display:block;margin:8px 0 4px}
		input,textarea{width:100%;padding:8px;box-sizing:border-box}
		button{margin-top:12px;padding:8px 12px}
		.entry{border:1px solid #ddd;padding:8px;margin:8px 0}
	</style>
</head>
<body>
	<h1>Store name and details</h1>
	<form id="detailsForm">
		<label for="name">Name</label>
		<input id="name" name="name" required>

		<label for="email">Email</label>
		<input id="email" name="email" type="email">

		<label for="phone">Phone</label>
		<input id="phone" name="phone" type="tel">

		<label for="address">Address</label>
		<textarea id="address" name="address" rows="3"></textarea>

		<button type="submit">Save</button>
		<button type="button" id="clear">Clear All</button>
	</form>

	<h2>Saved Entries</h2>
	<div id="entries"></div>

	<script>
		const form = document.getElementById('detailsForm');
		const entriesEl = document.getElementById('entries');

		function load() {
			const list = JSON.parse(localStorage.getItem('details')||'[]');
			entriesEl.innerHTML = '';
			list.forEach((item, i)=>{
				const div = document.createElement('div');
				div.className='entry';
				div.innerHTML = `<strong>${escapeHtml(item.name)}</strong>`+
					`<div>${escapeHtml(item.email)} ${escapeHtml(item.phone)}</div>`+
					`<div>${escapeHtml(item.address)}</div>`+
					`<button data-index="${i}" class="del">Delete</button>`;
				entriesEl.appendChild(div);
			});
		}

		function escapeHtml(s){
			if(!s) return '';
			return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
		}

		form.addEventListener('submit', e=>{
			e.preventDefault();
			const data = {
				name: form.name.value.trim(),
				email: form.email.value.trim(),
				phone: form.phone.value.trim(),
				address: form.address.value.trim()
			};
			const list = JSON.parse(localStorage.getItem('details')||'[]');
			list.push(data);
			localStorage.setItem('details', JSON.stringify(list));
			form.reset();
			load();
		});

		entriesEl.addEventListener('click', e=>{
			if(e.target.classList.contains('del')){
				const i = Number(e.target.getAttribute('data-index'));
				const list = JSON.parse(localStorage.getItem('details')||'[]');
				list.splice(i,1);
				localStorage.setItem('details', JSON.stringify(list));
				load();
			}
		});

		document.getElementById('clear').addEventListener('click', ()=>{
			if(confirm('Clear all saved entries?')){
				localStorage.removeItem('details');
				load();
			}
		});

		load();
	</script>
</body>
</html>
